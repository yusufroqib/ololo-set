<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ololo Evening Sets — Team Splitter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap');

:root{
  --asphalt: #17181A;
  --asphalt-2: #1F2123;
  --chalk: #F1EEE6;
  --chalk-dim: #A7A79C;
  --cone: #E85D2C;
  --line: rgba(241,238,230,0.14);

  --c1: #E85D2C; /* orange */
  --c2: #2E6FBE; /* blue */
  --c3: #F0BB3E; /* yellow */
  --c4: #2E9E6E; /* teal-green */
  --c5: #B33F62; /* maroon */
  --c6: #7A5EA8; /* purple */
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--asphalt);
  color: var(--chalk);
  font-family: 'Work Sans', sans-serif;
  min-height:100vh;
}

/* concrete texture + faint court markings */
.court-bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    radial-gradient(ellipse 700px 420px at 50% 0%, rgba(241,238,230,0.05), transparent 60%),
    radial-gradient(circle at 20% 15%, rgba(255,255,255,0.025), transparent 40%),
    radial-gradient(circle at 80% 85%, rgba(255,255,255,0.02), transparent 45%);
  background-color: var(--asphalt);
}
.court-lines{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.55;
}

.app{
  position:relative; z-index:1;
  max-width: 920px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}

.hero{
  text-align:center;
  margin-bottom: 40px;
}
.hero .eyebrow{
  color: var(--cone);
  font-weight:600;
  font-size: 13px;
  letter-spacing: 0.02em;
  margin-bottom: 6px;
}
.hero h1{
  font-family:'Anton', sans-serif;
  font-weight:400;
  font-size: clamp(48px, 9vw, 84px);
  line-height: 0.9;
  margin: 0 0 12px;
  letter-spacing: 0.01em;
  color: var(--chalk);
}
.hero p{
  color: var(--chalk-dim);
  font-size: 16px;
  max-width: 440px;
  margin: 0 auto;
  line-height:1.5;
}

.panels{
  display:grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 20px;
  margin-bottom: 28px;
}
@media (max-width: 720px){
  .panels{ grid-template-columns: 1fr; }
}

.panel{
  background: var(--asphalt-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 22px;
}
.panel h2{
  font-family:'Anton', sans-serif;
  font-weight:400;
  font-size: 20px;
  margin: 0 0 16px;
  letter-spacing:0.01em;
}

.add-row{
  display:flex;
  gap:8px;
  margin-bottom: 14px;
}
.add-row input{
  flex:1;
  background: var(--asphalt);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 11px 13px;
  color: var(--chalk);
  font-size: 15px;
  font-family: 'Work Sans', sans-serif;
}
.add-row input::placeholder{ color: var(--chalk-dim); }
.add-row input:focus{ outline: 2px solid var(--cone); outline-offset: 1px; }
.add-row button{
  background: var(--cone);
  color: var(--asphalt);
  border:none;
  border-radius: 7px;
  padding: 0 18px;
  font-weight: 700;
  font-size: 15px;
  cursor:pointer;
  transition: transform 0.12s ease, background 0.12s ease;
}
.add-row button:hover{ background:#f27444; }
.add-row button:active{ transform: scale(0.96); }

.player-chips{
  list-style:none;
  margin:0; padding:0;
  display:flex; flex-wrap:wrap; gap:8px;
  min-height: 40px;
}
.player-chips:empty::after{
  content: "No players yet. Add the first name above.";
  color: var(--chalk-dim);
  font-size: 14px;
}
.chip{
  display:flex; align-items:center; gap:8px;
  background: var(--asphalt);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 8px 6px 14px;
  font-size: 14px;
}
.chip button{
  background: transparent;
  border:none;
  color: var(--chalk-dim);
  width:20px; height:20px;
  border-radius:50%;
  cursor:pointer;
  font-size: 14px;
  line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.chip button:hover{ background: rgba(255,255,255,0.1); color: var(--chalk); }

.roster-count{
  margin-top: 14px;
  font-size: 13px;
  color: var(--chalk-dim);
}

.stepper-row{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom: 18px;
}
.stepper-row label{ font-size:15px; color: var(--chalk); }
.stepper{
  display:flex; align-items:center; gap:2px;
  background: var(--asphalt);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow:hidden;
}
.stepper button{
  background: transparent;
  border:none;
  color: var(--chalk);
  width: 34px; height: 34px;
  font-size: 17px;
  cursor:pointer;
}
.stepper button:hover{ background: rgba(255,255,255,0.06); }
.stepper span{
  font-family:'Anton', sans-serif;
  font-size: 18px;
  min-width: 34px;
  text-align:center;
}

.kickoff-btn{
  width:100%;
  background: var(--cone);
  color: var(--asphalt);
  border:none;
  border-radius: 8px;
  padding: 14px;
  font-family:'Anton', sans-serif;
  font-size: 17px;
  letter-spacing: 0.02em;
  cursor:pointer;
  margin-top: 6px;
  transition: transform 0.12s ease, background 0.12s ease;
}
.kickoff-btn:hover{ background:#f27444; }
.kickoff-btn:active{ transform: scale(0.98); }
.kickoff-btn:disabled{
  background: var(--asphalt);
  color: var(--chalk-dim);
  border: 1px solid var(--line);
  cursor: not-allowed;
}

.notice{
  margin-top: 10px;
  font-size: 13px;
  color: var(--c3);
  min-height: 16px;
}

.results{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
}

.team-card{
  background: var(--asphalt-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow:hidden;
  opacity:0;
  transform: translateY(14px);
  animation: rise 0.45s ease forwards;
}
@keyframes rise{
  to{ opacity:1; transform: translateY(0); }
}
.team-card .bib{
  height: 6px;
}
.team-card .team-head{
  padding: 16px 18px 10px;
  display:flex; align-items:baseline; justify-content:space-between;
}
.team-card .team-head h3{
  font-family:'Anton', sans-serif;
  font-weight:400;
  font-size: 19px;
  margin:0;
  letter-spacing:0.01em;
}
.team-card .team-head span{
  font-size: 12px;
  color: var(--chalk-dim);
}
.team-card ol{
  list-style:none;
  margin:0; padding: 4px 18px 18px;
}
.team-card ol li{
  display:flex; align-items:center; gap:10px;
  padding: 6px 0;
  font-size: 15px;
  border-top: 1px solid var(--line);
}
.team-card ol li:first-child{ border-top:none; }
.jersey-num{
  font-family:'Anton', sans-serif;
  font-size: 13px;
  width: 22px; height:22px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}

.bench-card{
  grid-column: 1 / -1;
  background: transparent;
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 14px 18px;
  opacity:0;
  transform: translateY(14px);
  animation: rise 0.45s ease forwards;
}
.bench-card h4{
  font-family:'Anton', sans-serif;
  font-weight:400;
  font-size: 15px;
  margin: 0 0 8px;
  color: var(--chalk-dim);
}
.bench-names{ font-size: 14px; color: var(--chalk); line-height:1.6; }

.results-toolbar{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom: 14px;
}
.results-toolbar h2{
  font-family:'Anton', sans-serif;
  font-weight:400; font-size:18px; margin:0;
}
.reshuffle-btn{
  background:transparent;
  border: 1px solid var(--line);
  color: var(--chalk);
  border-radius: 7px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight:600;
  cursor:pointer;
}
.reshuffle-btn:hover{ border-color: var(--cone); color: var(--cone); }

@media (prefers-reduced-motion: reduce){
  .team-card, .bench-card{ animation: none; opacity:1; transform:none; }
}
</style>
</head>
<body>

<div class="court-bg"></div>
<svg class="court-lines" width="100%" height="100%" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice">
  <g fill="none" stroke="#F1EEE6" stroke-width="3" opacity="0.07">
    <!-- touchlines / goal lines -->
    <rect x="40" y="40" width="520" height="820" rx="2"/>
    <!-- halfway line -->
    <line x1="40" y1="450" x2="560" y2="450"/>
    <!-- center circle + spot -->
    <circle cx="300" cy="450" r="90"/>
    <circle cx="300" cy="450" r="4" fill="#F1EEE6" stroke="none"/>
    <!-- top penalty area + six-yard box + arc -->
    <rect x="175" y="40" width="250" height="140"/>
    <rect x="225" y="40" width="150" height="55"/>
    <circle cx="300" cy="150" r="4" fill="#F1EEE6" stroke="none"/>
    <path d="M215,180 A90,90 0 0 1 385,180"/>
    <!-- bottom penalty area + six-yard box + arc -->
    <rect x="175" y="720" width="250" height="140"/>
    <rect x="225" y="805" width="150" height="55"/>
    <circle cx="300" cy="750" r="4" fill="#F1EEE6" stroke="none"/>
    <path d="M215,720 A90,90 0 0 0 385,720"/>
    <!-- corner arcs -->
    <path d="M40,58 A18,18 0 0 1 58,40"/>
    <path d="M542,40 A18,18 0 0 1 560,58"/>
    <path d="M40,842 A18,18 0 0 0 58,860"/>
    <path d="M542,860 A18,18 0 0 0 560,842"/>
  </g>
</svg>

<div class="app">
  <header class="hero">
    <div class="eyebrow" id="eyebrow">4-A-SIDE EVENING RUN</div>
    <h1>OLOLO EVENING SETS</h1>
    <p>Add who showed up this evening, set your teams, and split the squad.</p>
  </header>

  <div class="panels">
    <section class="panel">
      <h2>Who's here</h2>
      <div class="add-row">
        <input type="text" id="playerInput" placeholder="Add a player name" maxlength="24">
        <button id="addBtn">Add</button>
      </div>
      <ul class="player-chips" id="chipList"></ul>
      <div class="roster-count" id="rosterCount">0 players</div>
    </section>

    <section class="panel">
      <h2>Set the match</h2>
      <div class="stepper-row">
        <label>Teams</label>
        <div class="stepper">
          <button id="teamsMinus">−</button>
          <span id="teamsVal">2</span>
          <button id="teamsPlus">+</button>
        </div>
      </div>
      <div class="stepper-row">
        <label>Players per team</label>
        <div class="stepper">
          <button id="perMinus">−</button>
          <span id="perVal">4</span>
          <button id="perPlus">+</button>
        </div>
      </div>
      <button class="kickoff-btn" id="splitBtn">Split Teams</button>
      <div class="notice" id="notice"></div>
    </section>
  </div>

  <div id="resultsWrap"></div>
</div>

<script>
const colors = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];

let players = [];
let teamsCount = 2;
let perTeam = 4;
let lastTeams = null;
let lastBench = [];

const playerInput = document.getElementById('playerInput');
const addBtn = document.getElementById('addBtn');
const chipList = document.getElementById('chipList');
const rosterCount = document.getElementById('rosterCount');
const teamsVal = document.getElementById('teamsVal');
const perVal = document.getElementById('perVal');
const splitBtn = document.getElementById('splitBtn');
const notice = document.getElementById('notice');
const resultsWrap = document.getElementById('resultsWrap');
const eyebrow = document.getElementById('eyebrow');

function updateEyebrow(){
  eyebrow.textContent = `${perTeam}-A-SIDE EVENING RUN`;
}

function addPlayer(){
  const name = playerInput.value.trim();
  if(!name) return;
  players.push(name);
  playerInput.value = '';
  renderChips();
  playerInput.focus();
}

function removePlayer(idx){
  players.splice(idx,1);
  renderChips();
}

function renderChips(){
  chipList.innerHTML = '';
  players.forEach((name, idx) => {
    const li = document.createElement('li');
    li.className = 'chip';
    li.innerHTML = `<span>${escapeHtml(name)}</span><button aria-label="Remove ${escapeHtml(name)}">✕</button>`;
    li.querySelector('button').addEventListener('click', () => removePlayer(idx));
    chipList.appendChild(li);
  });
  rosterCount.textContent = `${players.length} player${players.length === 1 ? '' : 's'}`;
  updateNotice();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

addBtn.addEventListener('click', addPlayer);
playerInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); addPlayer(); }
});

document.getElementById('teamsMinus').addEventListener('click', () => {
  teamsCount = Math.max(2, teamsCount - 1);
  teamsVal.textContent = teamsCount;
  updateNotice();
});
document.getElementById('teamsPlus').addEventListener('click', () => {
  teamsCount = Math.min(12, teamsCount + 1);
  teamsVal.textContent = teamsCount;
  updateNotice();
});
document.getElementById('perMinus').addEventListener('click', () => {
  perTeam = Math.max(1, perTeam - 1);
  perVal.textContent = perTeam;
  updateEyebrow();
  updateNotice();
});
document.getElementById('perPlus').addEventListener('click', () => {
  perTeam = Math.min(15, perTeam + 1);
  perVal.textContent = perTeam;
  updateEyebrow();
  updateNotice();
});

function updateNotice(){
  if(players.length === 0){
    notice.textContent = '';
    splitBtn.disabled = false;
    return;
  }
  const needed = teamsCount * perTeam;
  if(players.length < teamsCount){
    notice.textContent = `Only ${players.length} player${players.length===1?'':'s'} for ${teamsCount} teams — some teams will be empty.`;
  } else if(players.length < needed){
    notice.textContent = `${players.length} players won't fill ${teamsCount} teams of ${perTeam} — teams will be uneven.`;
  } else if(players.length > needed){
    notice.textContent = `${players.length - needed} player${players.length-needed===1?'':'s'} will sit on the bench this round.`;
  } else {
    notice.textContent = '';
  }
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function splitTeams(){
  if(players.length === 0){
    playerInput.focus();
    return;
  }
  const shuffled = shuffle(players);
  const teams = Array.from({length: teamsCount}, () => []);
  let idx = 0;
  for(let t = 0; t < teamsCount; t++){
    for(let p = 0; p < perTeam; p++){
      if(idx >= shuffled.length) break;
      teams[t].push(shuffled[idx]);
      idx++;
    }
  }
  const bench = shuffled.slice(idx);
  lastTeams = teams;
  lastBench = bench;
  renderResults(teams, bench);
}

function renderResults(teams, bench){
  resultsWrap.innerHTML = '';

  const toolbar = document.createElement('div');
  toolbar.className = 'results-toolbar';
  toolbar.innerHTML = `<h2>This evening's sets</h2><button class="reshuffle-btn" id="reshuffleBtn">Reshuffle</button>`;
  resultsWrap.appendChild(toolbar);

  const grid = document.createElement('div');
  grid.className = 'results';

  teams.forEach((team, i) => {
    const c = colors[i % colors.length];
    const card = document.createElement('div');
    card.className = 'team-card';
    card.style.animationDelay = `${i * 0.06}s`;
    const playersHtml = team.map((name, j) =>
      `<li><span class="jersey-num" style="background:${c};color:var(--asphalt)">${j+1}</span>${escapeHtml(name)}</li>`
    ).join('') || `<li style="color:var(--chalk-dim);border-top:none;">No players assigned</li>`;
    card.innerHTML = `
      <div class="bib" style="background:${c}"></div>
      <div class="team-head">
        <h3>Set ${i + 1}</h3>
        <span>${team.length} player${team.length===1?'':'s'}</span>
      </div>
      <ol>${playersHtml}</ol>
    `;
    grid.appendChild(card);
  });

  resultsWrap.appendChild(grid);

  if(bench.length > 0){
    const benchCard = document.createElement('div');
    benchCard.className = 'bench-card';
    benchCard.style.animationDelay = `${teams.length * 0.06}s`;
    benchCard.innerHTML = `<h4>On the bench (${bench.length})</h4><div class="bench-names">${bench.map(escapeHtml).join(', ')}</div>`;
    resultsWrap.appendChild(benchCard);
  }

  document.getElementById('reshuffleBtn').addEventListener('click', splitTeams);
}

splitBtn.addEventListener('click', splitTeams);

renderChips();
</script>

</body>
</html>
